name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  agent-smoke:
    name: agent smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      # The offline path must keep working with no API key and no game installed.
      - name: doctor
        run: hoi4-harness doctor
      - name: the prompt is printable in every guidance mode
        run: |
          for pack in none unconstrained minimal doctrine historical coach hybrid; do
            hoi4-harness prompt --guidance "$pack" > /dev/null
          done

      # A full run in each control mode, then assert on the transcript rather
      # than on the exit code -- a run that "succeeds" while taking no actions
      # is the failure this is here to catch.
      - name: direct control
        run: hoi4-harness play --turns 30 --run-dir runs/direct
      - name: hybrid control (native AI runs operations)
        run: |
          HOI4_OPERATIONAL_CONTROL=ai hoi4-harness play \
            --guidance hybrid --turns 30 --live --allow-all --run-dir runs/hybrid
      - name: scenarios
        run: hoi4-harness eval --run-dir runs/eval

      - name: assert the runs did something
        run: python .github/scripts/check_run.py runs/direct runs/hybrid runs/eval

      # The transcripts are a convenience for reading a failed run, not a gate.
      # GitHub's artifact storage answered 403 on a finalize once and turned a
      # green run red, which is the one thing CI must never do.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: transcripts
          path: runs/
          retention-days: 7

  mod:
    name: mod static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_mod.py -q
